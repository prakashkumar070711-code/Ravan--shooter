<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAVAN SHOOTER</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  touch-action: none;
}

h2 {
  color: #ff0033;
  padding: 12px;
  letter-spacing: 3px;
}

canvas {
  background: #111;
  border: 2px solid #ff0033;
  display: block;
  margin: auto;
  width: 100%;
  max-width: 420px;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 25px;
  padding: 15px;
}

button {
  background: #ff0033;
  color: white;
  border: none;
  padding: 15px 22px;
  border-radius: 10px;
  font-size: 18px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>RAVAN SHOOTER</h2>
<p>Score: <span id="score">0</span></p>

<canvas id="game" width="360" height="480"></canvas>

<div class="controls">
  <button id="left">⬅️</button>
  <button id="shoot">🔥 FIRE</button>
  <button id="right">➡️</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");

let player = { x: 160, y: 425, w: 40, h: 30 };
let bullets = [];
let enemies = [];
let score = 0;
let gameOver = false;
let left = false;
let right = false;
let lastShot = 0;

function shoot() {
  if (gameOver) return;

  const now = Date.now();
  if (now - lastShot < 250) return;

  lastShot = now;
  bullets.push({
    x: player.x + player.w / 2 - 3,
    y: player.y,
    w: 6,
    h: 12
  });
}

function spawnEnemy() {
  if (gameOver) return;

  enemies.push({
    x: Math.random() * 320,
    y: -30,
    w: 30,
    h: 30,
    speed: 1.5 + Math.random() * 1.5
  });
}

function drawPlayer() {
  ctx.fillStyle = "#00ffcc";
  ctx.fillRect(player.x, player.y, player.w, player.h);

  ctx.fillStyle = "white";
  ctx.fillRect(player.x + 15, player.y - 10, 10, 12);
}

function loop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameOver) {
    ctx.fillStyle = "#ff0033";
    ctx.font = "bold 30px Arial";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", 180, 220);

    ctx.fillStyle = "white";
    ctx.font = "18px Arial";
    ctx.fillText("Tap to Restart", 180, 255);
    return;
  }

  if (left) player.x -= 4;
  if (right) player.x += 4;

  player.x = Math.max(0, Math.min(320, player.x));

  drawPlayer();

  ctx.fillStyle = "#ffff00";
  bullets.forEach(b => {
    b.y -= 7;
    ctx.fillRect(b.x, b.y, b.w, b.h);
  });

  ctx.fillStyle = "#ff0033";

  enemies.forEach(e => {
    e.y += e.speed;
    ctx.fillRect(e.x, e.y, e.w, e.h);

    if (
      e.y + e.h >= player.y &&
      e.x < player.x + player.w &&
      e.x + e.w > player.x
    ) {
      gameOver = true;
    }
  });

  bullets = bullets.filter(b => b.y > -20);

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (e.y > canvas.height) {
      enemies.splice(i, 1);
      continue;
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j];

      if (
        b.x < e.x + e.w &&
        b.x + b.w > e.x &&
        b.y < e.y + e.h &&
        b.y + b.h > e.y
      ) {
        enemies.splice(i, 1);
        bullets.splice(j, 1);
        score++;
        scoreText.textContent = score;
        break;
      }
    }
  }

  requestAnimationFrame(loop);
}

setInterval(spawnEnemy, 1000);

function startGame() {
  player.x = 160;
  bullets = [];
  enemies = [];
  score = 0;
  scoreText.textContent = score;
  gameOver = false;
  loop();
}

document.getElementById("left").onpointerdown = () => left = true;
document.getElementById("left").onpointerup = () => left = false;
document.getElementById("left").onpointerleave = () => left = false;

document.getElementById("right").onpointerdown = () => right = true;
document.getElementById("right").onpointerup = () => right = false;
document.getElementById("right").onpointerleave = () => right = false;

document.getElementById("shoot").onpointerdown = shoot;

canvas.addEventListener("pointerdown", () => {
  if (gameOver) startGame();
});

startGame();
</script>

</body>
</html>
